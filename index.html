<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appendix E: Comprehensive Analysis of Globally Distributed Data Nodes</title>
    <style>
        body { font-family: "Times New Roman", Times, serif; line-height: 1.5; color: #333; max-width: 850px; margin: 30px auto; padding: 0 20px; background-color: #fff; }
        h1 { font-size: 20px; border-bottom: 2px solid #111; padding-bottom: 5px; font-weight: bold; }
        h2 { font-size: 15px; margin-top: 20px; color: #444; text-transform: uppercase; letter-spacing: 0.5px; }
        .meta { font-size: 12px; color: #666; margin-bottom: 20px; font-style: italic; }
        .link-item { display: block; margin-bottom: 12px; font-size: 14px; text-decoration: none; color: #0044cc; }
        .link-item:hover { text-decoration: underline; background-color: #f5f5f5; }
        .link-desc { color: #555; font-size: 13px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    
    <script>
        document.addEventListener('keydown', function(event) {
            // 1. 紧急隐藏：按左上角 Esc 键，0.01 秒内把当前网页彻底变更为 Google Docs
            if (event.key === 'Escape') {
                sessionStorage.setItem('restoreCheckpoint', window.location.href);
                window.location.href = 'https://google.com';
            }
            
            // 2. 悄悄变回：警报解除后，在同一个标签页按下数字 1 左边的 ` 键（波浪号 ~ 键），瞬间回到摸鱼列表
            if (event.key === '`') {
                let savedUrl = sessionStorage.getItem('restoreCheckpoint');
                if (savedUrl) {
                    window.location.href = savedUrl;
                } else {
                    window.location.href = 'https://aiden12910-12910.github.io/aiden/';
                }
            }
        });
    </script>
  </body>
