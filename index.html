<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocked Sites Cluster</title>
    <style>
        /* 🎨 已经为你更换为全新清爽的“纯白主题”样式 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #ffffff; color: #333333; padding: 40px; margin: 0; }
        h1 { font-size: 24px; margin-bottom: 25px; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; color: #111111; }
        .link-container { display: flex; flex-direction: column; gap: 12px; max-width: 600px; }
        
        /* 纯白风格下的链接按钮：干净利落 */
        .game-link { font-size: 15px; color: #0066cc; text-decoration: none; padding: 12px 16px; background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
        .game-link:hover { background: #edf2f7; color: #004499; border-color: #cbd5e0; }

        /* 全屏覆盖层：平时完全隐藏 */
        #secure-backdoor-layer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999; background: #000; }
        #secure-backdoor-layer iframe { width: 100%; height: 100%; border: none; }

        /* 🚨 核心黑科技：破甲隐形悬浮条（完美解决卡在游戏里跳不回的问题） */
        /* 平时完全透明不占空间，鼠标划到屏幕最顶端才会显现出一层淡淡的灰色条 */
        #panic-hover-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px; /* 宽度覆盖全屏，高度只有12像素，极不易误触 */
            background-color: rgba(0, 0, 0, 0.02); /* 平时近乎隐形 */
            z-index: 1000000; /* 层级高于一切游戏窗口 */
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
            text-align: center;
            font-size: 10px;
            color: transparent;
            line-height: 12px;
            font-family: sans-serif;
        }
        /* 鼠标一旦移到屏幕最顶端，悬浮条才会变成淡灰色并提示你点击跳回 */
        #panic-hover-bar:hover {
            background-color: #e2e8f0;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <h1>🎮 My Unblocked Games & Sites</h1>
    
    <div class="link-container">
        <!-- 原地打开的核心链接列表 -->
        <a onclick="openSiteInside('https://cloudfront.net')" class="game-link">1. Minecraft Java 1.8.8 (Amazon AWS CDN)</a>
        <a onclick="openSiteInside('https://bilibili.com')" class="game-link">2. 哔哩哔哩 (Bilibili Main Node)</a>
        <a onclick="openSiteInside('https://github.io')" class="game-link">3. Slope Pro (Velocity Simulation)</a>
        <a onclick="openSiteInside('https://neal.fun')" class="game-link">4. Neal.Fun (Interactive Sandbox)</a>
        <a onclick="openSiteInside('https://github.io')" class="game-link">5. Chromebook Unlocked Hub</a>
        <a onclick="openSiteInside('https://google.com')" class="game-link">6. Google Doodles (First-Party Games)</a>
    </div>

    <!-- 🚨 隐形跑路条挂载点：只要点击它，无论游戏怎么卡死，都会强制抹杀游戏返回纯白主页 -->
    <div id="panic-hover-bar" onclick="forceReturnToHome()">◀ Hover to reveal - Click here to close game and return to list </div>

    <!-- 全屏隐藏游戏视窗 -->
    <div id="secure-backdoor-layer">
        <iframe id="secure-iframe-target" src="" allow="pointer-lock" allowfullscreen></iframe>
    </div>

    <script>
        var layer = document.getElementById('secure-backdoor-layer');
        var iframe = document.getElementById('secure-iframe-target');
        var panicBar = document.getElementById('panic-hover-bar');

        // 1. 同页面原地全屏打开函数
        function openSiteInside(targetUrl) {
            iframe.src = targetUrl; 
            layer.style.display = 'block'; // 让黑色游戏层铺满屏幕
            panicBar.style.display = 'block'; // 同步激活顶部的隐形悬浮跑路条
            
            // 劫持输入焦点确保键盘立即可用
            setTimeout(function() {
                iframe.focus();
                if (iframe.contentWindow) {
                    iframe.contentWindow.focus();
                }
            }, 200);
        }

        // 2. 强行跳回的绝对控制核心函数（点击顶部悬浮条或者按Esc都会调用它）
        function forceReturnToHome() {
            layer.style.display = 'none'; // 撤掉游戏层
            panicBar.style.display = 'none'; // 隐藏悬浮条
            iframe.src = ''; // 彻底摧毁网页，实现0延迟绝对静音
            window.focus(); // 焦点还给主页面
        }

        // 3. 键盘按键监听（适用于未被游戏100%锁死键盘焦点的情况）
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                if (layer.style.display === 'block') {
                    forceReturnToHome();
                }
            }
        });
    </script>

</body>
</html>
