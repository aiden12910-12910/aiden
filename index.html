<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocked Sites Cluster</title>
    <style>
        /* 极简清爽的深色系链接列表样式 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #fff; padding: 40px; margin: 0; }
        h1 { font-size: 24px; margin-bottom: 25px; border-bottom: 2px solid #222; padding-bottom: 10px; color: #e0e0e0; }
        .link-container { display: flex; flex-direction: column; gap: 12px; max-width: 600px; }
        
        /* 纯链接按钮样式 */
        .game-link { font-size: 15px; color: #4da6ff; text-decoration: none; padding: 12px 16px; background: #1e1e1e; border: 1px solid #333; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
        .game-link:hover { background: #2a2a2a; color: #fff; border-color: #4da6ff; }

        /* 全屏覆盖层：平时完全隐藏，点击链接后100%吃掉当前页面 */
        #secure-backdoor-layer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999; background: #000; }
        #secure-backdoor-layer iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h1>🎮 My Unblocked Games & Sites</h1>
    
    <div class="link-container">
        <!-- 核心功能：全部采用 onclick 触发，强制在同一个标签页内全屏加载 -->
        <a onclick="openSiteInside('https://d1tm91r4ytbt54.cloudfront.net/2779cbcb-a02f-48a3-9e2e-95a8d123d165/1685483461665/web/index.html')" class="game-link">1. Minecraft Java 1.8.8 (Amazon AWS CDN)</a>
        <a onclick="openSiteInside('https://bilibili.com')" class="game-link">2. 哔哩哔哩 (Bilibili Main Node)</a>
        <a onclick="openSiteInside('https://slope-pro.github.io/')" class="game-link">3. Slope Pro (Velocity Simulation)</a>
        <a onclick="openSiteInside('https://neal.fun')" class="game-link">4. Neal.Fun (Interactive Sandbox)</a>
        <a onclick="openSiteInside('https://dnrweqffuwjtx.cloudfront.net/')" class="game-link">5. Chromebook Unlocked Hub</a>
        <a onclick="openSiteInside('https://www.google.com/search?q=%E2%80%AAGoogle+games&sca_esv=bc87673d3ad1280f&hl=en&ei=Ycz4abfqJeS9ptQP8b7k4Ag&biw=1366&bih=599&ved=0ahUKEwj3nvLkiaCUAxXknokEHXEfGYwQ4dUDCBE&uact=5&oq=%E2%80%AAGoogle+games&gs_lp=Egxnd3Mtd2l6LXNlcnAiD-KAqkdvb2dsZSBnYW1lczIGEAAYFhgeMgYQABgWGB4yBhAAGBYYHjIGEAAYFhgeMgYQABgWGB4yBhAAGBYYHjIGEAAYFhgeMgYQABgWGB4yBhAAGBYYHjIGEAAYFhgeSIQxUABYxSVwAHgBkAECmAHDCqAB30iqAQszLTEuMS4xLjIuNbgBA8gBAPgBAZgCBqACrinCAgIQJsICCBAAGIAEGKIEwgIFEAAY7wXCAgQQABgemAMAkgcJNC0yLjAuMi4yoAfxLbIHCTQtMi4wLjIuMrgHrinCBwMzLTbIB0WACAE&sclient=gws-wiz-serp&safe=active&ssui=on')" class="game-link">6. Google Doodles (First-Party Games)</a>
    </div>

    <!-- 全屏隐藏游戏黑洞容器 -->
    <div id="secure-backdoor-layer">
        <iframe id="secure-iframe-target" src="" allow="pointer-lock" allowfullscreen></iframe>
    </div>

    <!-- 核心控制逻辑脚本 -->
    <script>
        // 1. 同页面原地全屏打开函数
        function openSiteInside(targetUrl) {
            var layer = document.getElementById('secure-backdoor-layer');
            var iframe = document.getElementById('secure-iframe-target');
            
            iframe.src = targetUrl; // 将要打开的网站灌入当前页面的容器中
            layer.style.display = 'block'; // 让隐藏容器瞬间全屏铺满，100%遮挡列表
            
            // 解决3D游戏键盘死锁：强行给当前页面的内嵌窗口劫持输入焦点
            setTimeout(function() {
                iframe.focus();
                if (iframe.contentWindow) {
                    iframe.contentWindow.focus();
                }
            }, 200);
        }

        // 2. 监听按 Esc 键瞬间原路退回的逻辑
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                var layer = document.getElementById('secure-backdoor-layer');
                var iframe = document.getElementById('secure-iframe-target');
                
                // 如果当前正在玩游戏/刷B站，按一下 Esc 瞬间将画面摧毁并原地变回列表
                if (layer.style.display === 'block') {
                    layer.style.display = 'none'; // 撤掉全屏覆盖层
                    iframe.src = ''; // 强行斩断游戏/视频进程，消灭全部音效，绝不漏音
                    window.focus(); // 把焦点重新还给列表主页
                }
            }
        });
    </script>

</body>
</html>
